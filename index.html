<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!--
    Documents are rendered into this page, so a crafted file must never get to run script:
    only our own bundled scripts run (no inline handlers, no javascript: links, no eval),
    and nothing outside the app can be loaded.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://euhaan.github.io/folio/ 'wasm-unsafe-eval'; style-src https://euhaan.github.io/folio/ 'unsafe-inline'; img-src https://euhaan.github.io/folio/ data: blob:; font-src https://euhaan.github.io/folio/ data: blob:; connect-src https://euhaan.github.io/folio/ https://euhaan.github.io/folio-models/; manifest-src https://euhaan.github.io/folio/; worker-src https://euhaan.github.io/folio/ blob:; frame-src https://euhaan.github.io/folio/; object-src 'none'; base-uri 'none'; form-action 'none'">
  <!-- viewport-fit=cover lets the layout pad itself around the iPhone notch and home bar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.25, maximum-scale=8, user-scalable=yes, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f3ec">
  <!-- Home-screen web app (iPhone: Safari → 공유 → 홈 화면에 추가) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Folio">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="한글, 엑셀, 워드, 파워포인트, PDF를 광고 없이 바로 여는 문서 뷰어">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Folio">
  <meta property="og:description" content="광고 없이 바로 여는 문서 뷰어. 문서는 휴대폰 밖으로 나가지 않아요.">
  <meta property="og:url" content="https://euhaan.github.io/folio/">
  <meta property="og:image" content="https://euhaan.github.io/folio/icon-512.png">
  <title>Folio</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar">
    <span id="doc-badge"></span>
    <div class="title">
      <div id="doc-name">Folio</div>
      <div id="doc-meta"></div>
    </div>
    <button id="theme-btn" class="icon-btn" type="button"></button>
    <button id="info-btn" class="icon-btn" type="button" aria-label="설정 · 도움말">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M19.28 10.7L21.55 11.06L21.55 12.94L19.28 13.3L18.07 16.23L19.42 18.09L18.09 19.42L16.23 18.07L13.3 19.28L12.94 21.55L11.06 21.55L10.7 19.28L7.77 18.07L5.91 19.42L4.58 18.09L5.93 16.23L4.72 13.3L2.45 12.94L2.45 11.06L4.72 10.7L5.93 7.77L4.58 5.91L5.91 4.58L7.77 5.93L10.7 4.72L11.06 2.45L12.94 2.45L13.3 4.72L16.23 5.93L18.09 4.58L19.42 5.91L18.07 7.77Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
    <button id="open-btn" class="open-btn" type="button" aria-label="파일 열기">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>열기</span>
    </button>
  </header>
  <main id="view"></main>
  <!-- Screen readers hear status changes (opening, opened) from here. -->
  <div id="status" class="sr-only" aria-live="polite"></div>
  <!-- The fallback for browsers without showOpenFilePicker. No accept list: on real phones it
       greyed out documents (providers report .hwp and others under varying types). -->
  <input id="file-input" type="file" hidden>
</body>
</html>
